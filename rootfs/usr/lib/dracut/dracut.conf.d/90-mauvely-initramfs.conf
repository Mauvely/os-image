# Mauvely OS: keep the initramfs small enough for /boot.
#
# `bootc install to-disk` makes a 510 MB /boot (446 MB usable), and Kinoite's
# generic initramfs is 238 MB, most of it GPU firmware: NVIDIA's alone is
# 104 MB. A kernel and its initramfs then need ~257 MB, two never fit, and every
# update that brings a new kernel fails at shutdown ("Installing kernel: regfile
# copy: No space left on device"), seen on the first Proxmox install.
#
# Without the NVIDIA and AMD display drivers it is ~96 MB. Those machines show
# the splash and the recovery prompt on the firmware's framebuffer (simpledrm),
# and the real driver loads from the root filesystem a few seconds later.
# Intel's driver and firmware are small and stay.
omit_drivers+=" nouveau nova_core nova_drm amdgpu radeon "

# Fedora's compose runs dracut with `--add ostree`; a plain dracut leaves the
# module out, and without ostree-prepare-root the initramfs unlocks the disk and
# then fails at "Switch Root" (seen on the VM, 2026-10-21). The Containerfile
# refuses an initramfs without it.
add_dracutmodules+=" ostree "
