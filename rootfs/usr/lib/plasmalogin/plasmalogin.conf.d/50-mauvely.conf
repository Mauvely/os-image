# Mauvely OS: the login screen shows the Mauvely wallpaper (brief 25). Files here
# override Fedora's /usr/lib/plasmalogin/defaults.conf; /etc/plasmalogin.conf
# overrides them. The greeter's colours and fonts come from the Mauvely global
# theme, through /etc/profile.d/mauvely-xdg.sh.

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/Mauvely/
PreviewImage=file:///usr/share/wallpapers/Mauvely/
