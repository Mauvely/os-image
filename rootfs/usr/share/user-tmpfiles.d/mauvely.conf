# The sign-in broker's directory (os-agent, mauvely-session), made at login
# before any app starts. Flatpak shares `xdg-run/mauvely` into an app only if
# the directory exists when the app starts, so an app opened before
# mauvely-session would have no broker until it was restarted.
d %t/mauvely 0700 - - -
